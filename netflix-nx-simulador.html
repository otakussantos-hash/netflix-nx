<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Netflix NX - simulador</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0b0d;color:#b8bcc6;font:14px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
#stage{width:100%;max-width:1280px}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#141414;outline:1px solid #26262b}
.bar{width:100%;max-width:1280px;display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.bar input{flex:1;min-width:220px;background:#16171b;color:#dfe2e8;border:1px solid #2a2c33;border-radius:6px;padding:7px 9px;font:inherit}
button{background:#25272e;color:#e6e8ed;border:0;border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer;user-select:none;touch-action:manipulation}
button:active{background:#e50914}
button:focus-visible,input:focus-visible{outline:2px solid #e50914;outline-offset:1px}
.pad{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;margin:6px 0}
.grp{display:grid;grid-template-columns:repeat(3,52px);gap:6px}
.grp button{padding:10px 0}
.hint{max-width:1280px;color:#7d818c;font-size:12.5px;text-align:center}
</style>
</head>
<body>
<div class="bar">
  <input id="url" aria-label="URL do videos.json" value="https://raw.githubusercontent.com/otakussantos-hash/netflix-nx/main/videos.json">
  <button id="reload">Recarregar JSON</button>
  <button id="openLocal">Usar videos.json local…</button>
  <button id="fs">Tela cheia</button>
  <input type="file" id="file" accept=".json" hidden>
</div>
<div id="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
<div class="pad" aria-label="Controle">
  <div class="grp">
    <button data-b="l">L</button><button data-b="up">&uarr;</button><button data-b="r">R</button>
    <button data-b="left">&larr;</button><button data-b="plus">+</button><button data-b="right">&rarr;</button>
    <button data-b="zl">ZL</button><span></span><button data-b="zr">ZR</button>
    <span></span><button data-b="down">&darr;</button><span></span>
  </div>
  <div class="grp">
    <span></span><button disabled>X</button><span></span>
    <button disabled>Y</button><span></span><button data-b="a">A</button>
    <span></span><button data-b="b">B</button><span></span>
  </div>
</div>
<p class="hint">Teclado: setas = direcional, [ ou PageUp = L, ] ou PageDown = R, Enter ou Z = A, Esc ou X = B, Q = ZL, E = ZR, P = +. Controle USB/Bluetooth também funciona.</p>

<script>
const JSON_URL = "https://raw.githubusercontent.com/otakussantos-hash/netflix-nx/main/videos.json";
const W = 1280, H = 720;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const FONT = '"Nintendo Switch","Segoe UI","Noto Sans",Roboto,Arial,sans-serif';
const FS = [18, 26, 56, 40];
const WHITE = [255,255,255,255], GRAY = [170,170,170,255], RED = [229,9,20,255], BLACK = [0,0,0,255];

// ---------- desenho (mesmas funcoes do main.cpp) ----------
function rect(x, y, w, h, r, g, b, a) { ctx.fillStyle = `rgba(${r},${g},${b},${a/255})`; ctx.fillRect(x, y, w, h); }
function clear(r, g, b) { rect(0, 0, W, H, r, g, b, 255); }
function txt(f, s, x, y, c = WHITE) {
  if (!s) return;
  ctx.font = FS[f] + "px " + FONT; ctx.textBaseline = "top";
  ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${c[3]/255})`; ctx.fillText(s, x, y);
}
function clip(x, y, w, h) { ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); }
function unclip() { ctx.restore(); }
function fmt(s) {
  const t = Math.floor(s), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), sec = t % 60;
  const p = n => String(n).padStart(2, "0");
  return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
}

// ---------- Google Drive ----------
function driveId(u) {
  if (u.startsWith("gdrive:")) return u.slice(7);
  if (/^[A-Za-z0-9_-]{20,}$/.test(u)) return u;
  if (!u.includes("drive.google.com") && !u.includes("drive.usercontent.google.com")) return "";
  let s, p = u.indexOf("/d/");
  if (p >= 0) s = p + 3;
  else { p = u.indexOf("id="); if (p < 0) return ""; s = p + 3; }
  const m = u.slice(s).search(/[\/?&#]/);
  return m < 0 ? u.slice(s) : u.slice(s, s + m);
}
function fixVideo(u) { const id = driveId(u); return id ? `https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t` : u; }
function fixCover(u) { const id = driveId(u); return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w640` : u; }

// ---------- estado ----------
let items = [], ok = false, err = "", row = 0, col = 0, first = [0, 0], rows = [], pf = [0, 0], pdir = [1, 1], ptime = [0, 0];
const logo = new Image(); logo.src = "romfs/logo.png";
let mode = "boot", token = 0, localJson = null, errUntil = 0;
let down = {};

async function load() {
  const tk = ++token;
  mode = "boot"; items = []; ok = false; err = ""; row = col = 0; first = [0, 0]; pf = [0, 0]; ptime = [0, 0]; rows = [];
  const url = $("url").value.trim() || JSON_URL;
  let text = null;
  try {
    const c = new AbortController(), t = setTimeout(() => c.abort(), 20000);
    const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { signal: c.signal, cache: "no-store" });
    clearTimeout(t);
    if (r.ok) text = await r.text();
  } catch (e) {}
  if (!text || !text.trim()) text = localJson;  // reserva local, como o videos.json do SD
  if (tk !== token) return;
  if (!text) { err = "Falha ao baixar o JSON do GitHub (sem internet?)"; mode = "menu"; return; }
  try {
    const vs = JSON.parse(text).videos;
    if (!Array.isArray(vs)) throw 0;
    for (const v of vs) {
      const st = k => v[k] === undefined || v[k] === null ? "" : String(v[k]);
      const it = { titulo: String(v.titulo ?? "Sem titulo"), url: "", capa: fixCover(String(v.capa ?? "")), img: null,
                   sinopse: st("sinopse"), ano: st("ano"), genero: st("genero"), duracao: st("duracao"), seasons: [] };
      if (Array.isArray(v.temporadas)) {
        v.temporadas.forEach((t, si) => it.seasons.push({ nome: String(t.nome ?? "Temporada " + (si + 1)),
          eps: (Array.isArray(t.episodios) ? t.episodios : []).map((e, ei) => ({ titulo: String(e.titulo ?? "Episodio " + (ei + 1)), url: fixVideo(String(e.url)) })) }));
      } else {
        if (typeof v.url !== "string") throw 0;
        it.url = fixVideo(v.url);
      }
      items.push(it);
    }
  } catch (e) { items = []; err = "JSON invalido"; mode = "menu"; return; }
  if (!items.length) { err = "Nenhum video no JSON"; mode = "menu"; return; }
  rows = [{ label: "Novidades", idx: items.slice(0, 8).map((_, i) => i) }, { label: "Todos os títulos", idx: items.map((_, i) => i) }];
  ok = true; mode = "menu";
  loadCovers(tk);
}
async function loadCovers(tk) {  // baixa as capas em sequencia, em segundo plano
  for (const it of items) {
    if (tk !== token) break;
    if (!it.capa) continue;
    await new Promise(res => { const im = new Image(); im.referrerPolicy = "no-referrer"; im.onload = () => { it.img = im; res(); }; im.onerror = res; im.src = it.capa; });
  }
}

// ---------- telas (layout igual ao do app: 4 cards por fileira, L/R troca de pagina) ----------
const PG = 4, X0 = 48, CW = 272, CH = 153, GAP = 32, HERO_H = 270, LY = [272, 478], CY = [314, 520];
const maxFirst = n => Math.max(0, n - PG), nPages = n => Math.max(1, Math.ceil(n / PG));
const curPage = (f, n) => (n > PG && f >= maxFirst(n)) ? nPages(n) - 1 : Math.floor(f / PG);
const pageNext = (f, n) => Math.min((Math.floor(f / PG) + 1) * PG, maxFirst(n));
const pagePrev = f => f <= 0 ? 0 : Math.floor((f - 1) / PG) * PG;
function scrollTo(f, c, n) {
  f = Math.max(0, Math.min(f, maxFirst(n)));
  if (c > f + PG - 1) f = Math.min(Math.floor(c / PG) * PG, maxFirst(n));
  else if (c < f) f = Math.floor(c / PG) * PG;
  return f;
}
const ez = x => { x = Math.max(0, Math.min(1, x)); return 1 - (1 - x) ** 3; };
function tw(f, s) { ctx.font = FS[f] + "px " + FONT; return ctx.measureText(s).width; }
function fit(f, s, maxw) {
  if (tw(f, s) <= maxw) return s;
  let t = s;
  while (t.length && tw(f, t.trimEnd() + "...") > maxw) t = t.slice(0, -1);
  return t.trimEnd() + "...";
}
function wrapPx(f, s, maxw, maxl) {
  const out = []; let line = "";
  for (const w of s.split(/\s+/).filter(Boolean)) {
    const c = line ? line + " " + w : w;
    if (!line || tw(f, c) <= maxw) line = c; else { out.push(line); line = w; }
  }
  if (line) out.push(line);
  if (out.length > maxl) { const rest = out.slice(maxl - 1).join(" "); out.length = maxl; out[maxl - 1] = rest; }
  return out.map(l => fit(f, l, maxw));
}
function drawCover(img, x, y, w, h, fy = 0.5) {  // preenche sem distorcer (corta o excesso)
  const iw = img.naturalWidth, ih = img.naturalHeight;
  let sx = 0, sy = 0, sw = iw, sh = ih;
  if (iw * h > ih * w) { sw = ih * w / h; sx = (iw - sw) / 2; } else { sh = iw * h / w; sy = (ih - sh) * fy; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
function fillCircle(cx, cy, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill(); }
function chevron(cx, cy, s, dir) {
  ctx.strokeStyle = "rgba(255,255,255,.82)"; ctx.lineWidth = 3; ctx.beginPath();
  ctx.moveTo(cx - dir * s / 2, cy - s); ctx.lineTo(cx + dir * s / 2, cy); ctx.lineTo(cx - dir * s / 2, cy + s); ctx.stroke();
}
function drawPager(y, pages, cur, active) {
  if (pages < 2) return;
  const key = (x, s, on) => {
    const c = active && on ? 96 : 50; rect(x, y + 6, 30, 24, c, c, c, 255);
    txt(0, s, x + (30 - tw(0, s)) / 2, y + 7, active && on ? WHITE : GRAY);
  };
  const num = (cur + 1) + " / " + pages, midw = pages <= 10 ? pages * 18 : tw(0, num);
  let x = X0 + 4 * CW + 3 * GAP - 30;
  key(x, "R", cur < pages - 1);
  x -= 12 + midw;
  if (pages <= 10) for (let i = 0; i < pages; i++)
    i === cur ? fillCircle(x + 9 + i * 18, y + 18, 5, active ? "#fff" : "#969696") : fillCircle(x + 9 + i * 18, y + 18, 4, "#505050");
  else txt(0, num, x, y + 7, GRAY);
  key(x - 42, "L", cur > 0);
}
function drawHero(it) {
  if (it.img) drawCover(it.img, 480, 0, 800, HERO_H, 0.25);
  let g = ctx.createLinearGradient(480, 0, 960, 0);
  g.addColorStop(0, "#141414"); g.addColorStop(1, "rgba(20,20,20,0)");
  rect(0, 0, 480, HERO_H, 20, 20, 20, 255); ctx.fillStyle = g; ctx.fillRect(480, 0, 480, HERO_H);
  g = ctx.createLinearGradient(0, HERO_H - 45, 0, HERO_H);
  g.addColorStop(0, "rgba(20,20,20,0)"); g.addColorStop(1, "#141414"); ctx.fillStyle = g; ctx.fillRect(0, HERO_H - 45, W, 45);
  if (logo.complete && logo.naturalWidth) ctx.drawImage(logo, X0, 14, logo.naturalWidth * 32 / logo.naturalHeight, 32);
  else txt(1, "NETFLIX", X0, 14, RED);
  if (tw(2, it.titulo) <= 640) txt(2, it.titulo, X0, 50);
  else wrapPx(3, it.titulo, 640, 2).forEach((l, i) => txt(3, l, X0, 46 + i * 42));
  let meta = [it.ano, it.genero, it.duracao].filter(Boolean).join("  |  ");
  if (it.seasons.length) meta += (meta ? "  |  " : "") + it.seasons.length + (it.seasons.length === 1 ? " temporada" : " temporadas");
  txt(0, fit(0, meta, 640), X0, 136, GRAY);
  wrapPx(0, it.sinopse, 600, 2).forEach((l, i) => txt(0, l, X0, 162 + i * 22, [200, 200, 200, 255]));
  rect(X0, 216, 200, 36, 255, 255, 255, 255);
  ctx.fillStyle = "#000"; ctx.beginPath(); ctx.moveTo(X0 + 16, 226); ctx.lineTo(X0 + 28, 234); ctx.lineTo(X0 + 16, 242); ctx.fill();
  txt(1, "Assistir", X0 + 44, 218, BLACK);
}
function drawCard(it, x, y, sel) {
  let w = CW, h = CH;
  if (sel) { x -= 8; y -= 8; w += 16; h += 16; }
  rect(x, y, w, h, 38, 38, 38, 255);
  if (it.img) drawCover(it.img, x, y, w, h);
  else if (!it.capa) wrapPx(0, it.titulo, w - 28, 3).forEach((l, i, a) => txt(0, l, x + 14, y + (h - a.length * 24) / 2 + i * 24));
  if (!sel) rect(x, y, w, h, 0, 0, 0, 80);
  if (sel) for (let i = 0; i < 3; i++) {
    const bx = x - i, by = y - i, bw = w + 2 * i, bh = h + 2 * i;
    rect(bx, by, bw, 1, 255, 255, 255, 255); rect(bx, by + bh - 1, bw, 1, 255, 255, 255, 255);
    rect(bx, by, 1, bh, 255, 255, 255, 255); rect(bx + bw - 1, by, 1, bh, 255, 255, 255, 255);
  }
}
function menu(d, now) {
  clear(20, 20, 20);
  if (!ok) {
    txt(1, err, 48, 320);
    txt(0, "Coloque videos.json (ou videos_url.txt) em sdmc:/switch/netflix-player/  |  + sai", 48, 370, GRAY);
    if (d.plus) mode = "exited";
    return;
  }
  if (d.plus) { mode = "exited"; return; }
  const prow = row; let slot = col - first[row];
  if (d.up) row = 0;
  if (d.down) row = 1;
  if (row !== prow) col = first[row] + Math.max(0, Math.min(slot, PG - 1));
  const N = rows[row].idx.length;
  if (d.left) col--;
  if (d.right) col++;
  col = Math.max(0, Math.min(col, N - 1));
  first[row] = scrollTo(first[row], col, N);
  slot = col - first[row];
  if (d.r || d.zr) { const nf = pageNext(first[row], N); if (nf !== first[row]) { first[row] = nf; col = Math.min(N - 1, nf + slot); } }
  if (d.l || d.zl) { const nf = pagePrev(first[row]); if (nf !== first[row]) { first[row] = nf; col = nf + slot; } }
  for (let r = 0; r < 2; r++) if (first[r] !== pf[r]) { pdir[r] = first[r] > pf[r] ? 1 : -1; ptime[r] = now; pf[r] = first[r]; }
  if (d.a) { startDetail(items[rows[row].idx[col]]); return; }
  drawHero(items[rows[row].idx[col]]);
  for (let r = 0; r < 2; r++) {
    const R = rows[r], n = R.idx.length, pages = nPages(n), cp = curPage(first[r], n);
    txt(1, R.label, X0, LY[r]);
    drawPager(LY[r], pages, cp, r === row);
    const pa = ez((now - ptime[r]) / 280), off = (1 - pa) * 80 * pdir[r];
    ctx.globalAlpha = 0.2 + 0.8 * pa;
    for (let i = first[r], k = 0; i < Math.min(n, first[r] + PG); i++, k++)
      drawCard(items[R.idx[i]], X0 + k * (CW + GAP) + off, CY[r], r === row && i === col);
    ctx.globalAlpha = 1;
    if (r === row) {
      if (cp > 0) chevron(24, CY[r] + CH / 2, 14, -1);
      if (cp < pages - 1) chevron(1256, CY[r] + CH / 2, 14, 1);
    }
  }
  txt(0, "Direcional mover   |   L / R mudar de página   |   A abrir   |   + sair", X0, 696, GRAY);
}

// ---------- detalhes ----------
function wrap(s, width) {
  const out = []; let line = "";
  for (const para of s.split("\n")) {
    for (let w of para.split(" ")) {
      if (!w) continue;
      if (line && line.length + 1 + w.length > width) { out.push(line); line = ""; }
      while (w.length > width) { out.push(w.slice(0, width)); w = w.slice(width); }
      line += (line ? " " : "") + w;
    }
    out.push(line); line = "";
  }
  while (out.length && !out[out.length - 1]) out.pop();
  return out;
}
let dit = null, ss = 0, ep = 0, etop = 0;
const ROWS = 5, LIGHT = [200,200,200,255];
function startDetail(it) { dit = it; ss = ep = etop = 0; mode = "detail"; }
function playEp() {
  const S = dit.seasons[ss];
  startPlay(`${dit.titulo}  -  T${ss + 1} E${ep + 1}  ${S.eps[ep].titulo}`, S.eps[ep].url);
}
function detail(d) {
  if (d.b) { mode = "menu"; return; }
  const it = dit, serie = it.seasons.length > 0;
  if (!serie) { if (d.a) { startPlay(it.titulo, it.url); return; } }
  else {
    const ns = it.seasons.length;
    if (d.left && ss > 0) { ss--; ep = 0; etop = 0; }
    if (d.right && ss + 1 < ns) { ss++; ep = 0; etop = 0; }
    const ne = it.seasons[ss].eps.length;
    if (d.up && ep > 0) ep--;
    if (d.down && ep + 1 < ne) ep++;
    if (ep < etop) etop = ep;
    if (ep >= etop + ROWS) etop = ep - ROWS + 1;
    if (d.a && ne > 0) { playEp(); return; }
  }
  clear(20, 20, 20);
  if (it.img) drawCover(it.img, 480, 0, 800, 360, 0.25);
  rect(0, 0, 480, 360, 20, 20, 20, 255);
  for (let i = 0; i < 48; i++) rect(480 + i * 10, 0, 10, 360, 20, 20, 20, 255 - Math.floor(i * 255 / 47));
  for (let i = 0; i < 60; i++) rect(0, 300 + i, 1280, 1, 20, 20, 20, Math.floor(i * 255 / 59));
  txt(1, serie ? "SERIE" : "FILME", 48, 28, RED);
  clip(48, 60, 700, 70); txt(2, it.titulo, 48, 60); unclip();
  let meta = [it.ano, it.genero, it.duracao].filter(Boolean).join("  |  ");
  if (serie) meta += (meta ? "  |  " : "") + it.seasons.length + (it.seasons.length === 1 ? " temporada" : " temporadas");
  txt(0, meta, 48, 136, GRAY);
  wrap(it.sinopse || "Sem descricao.", 60).slice(0, 7).forEach((l, i) => txt(0, l, 48, 170 + i * 24, LIGHT));
  if (!serie) {
    rect(48, 400, 220, 52, 255, 255, 255, 255);
    txt(1, "A  Assistir", 68, 410, BLACK);
    txt(0, "B  Voltar", 48, 690, GRAY);
  } else {
    const ns = it.seasons.length, tfirst = Math.max(0, Math.min(ss - 2, ns - 5));
    for (let i = tfirst; i < Math.min(ns, tfirst + 5); i++) {
      const x = 48 + (i - tfirst) * 236, sel = i === ss, c = sel ? 255 : 55;
      rect(x, 372, 228, 40, c, c, c, 255);
      clip(x, 372, 228, 40); txt(1, it.seasons[i].nome, x + 12, 378, sel ? BLACK : WHITE); unclip();
    }
    const S = it.seasons[ss];
    if (!S.eps.length) txt(1, "Nenhum episodio nesta temporada", 48, 440, GRAY);
    for (let i = etop; i < Math.min(S.eps.length, etop + ROWS); i++) {
      const ry = 424 + (i - etop) * 52, sel = i === ep, c = sel ? 255 : 40;
      rect(48, ry, 1184, 48, c, c, c, 255);
      clip(48, ry, 1184, 48); txt(1, `${i + 1}   ${S.eps[i].titulo}`, 64, ry + 10, sel ? BLACK : WHITE); unclip();
    }
    txt(0, "Cima/Baixo episodio   Esq/Dir temporada   A assistir   B voltar", 48, 692, GRAY);
  }
}

// ---------- player ----------
let vid = null, cur = null, paused = false, ui = 0, erro = "", waiting = false;
function startPlay(title, url) {
  cur = { titulo: title }; paused = false; erro = ""; waiting = true; ui = performance.now(); mode = "play";
  vid = document.createElement("video");
  vid.playsInline = true; vid.preload = "auto"; vid.src = url;
  vid.onerror = () => { erro = "loading failed"; endPlay(); };
  vid.onended = () => endPlay(true);
  vid.onwaiting = () => waiting = true;
  vid.onplaying = vid.oncanplay = () => waiting = false;
  vid.play().catch(() => {});
}
function endPlay(ended) {
  if (!vid) return;
  vid.pause(); vid.removeAttribute("src"); vid.load(); vid = null;
  if (erro) { mode = "err"; errUntil = performance.now() + 3000; return; }
  mode = "detail";
  if (ended && dit.seasons.length) {  // proximo episodio automaticamente
    const S = dit.seasons[ss];
    if (ep + 1 < S.eps.length) { ep++; playEp(); }
    else if (ss + 1 < dit.seasons.length && dit.seasons[ss + 1].eps.length) { ss++; ep = 0; etop = 0; playEp(); }
  }
}
function player(d, now) {
  if (d.b) { endPlay(); return; }
  const dur = vid && isFinite(vid.duration) ? vid.duration : 0;
  const seek = s => { vid.currentTime = Math.max(0, Math.min(vid.currentTime + s, dur || 1e9)); ui = now; };
  if (d.a) { paused = !paused; paused ? vid.pause() : vid.play().catch(() => {}); ui = now; }
  if (d.left) seek(-10); if (d.right) seek(10); if (d.zl) seek(-60); if (d.zr) seek(60);
  if (d.up || d.down) ui = now;
  if (!vid) return;
  clear(0, 0, 0);
  if (vid.readyState >= 2) ctx.drawImage(vid, 0, 0, W, H);
  const pos = vid.currentTime || 0;
  if (waiting && !paused) txt(1, "Carregando buffer...", 520, 340);
  if (paused || now - ui < 3500) {
    rect(0, 600, 1280, 120, 0, 0, 0, 180);
    txt(1, cur.titulo, 48, 612);
    rect(48, 668, 1184, 6, 90, 90, 90, 255);
    if (dur > 0) rect(48, 668, Math.floor(1184 * Math.min(1, pos / dur)), 6, 229, 9, 20, 255);
    txt(0, fmt(pos) + " / " + fmt(dur) + (paused ? "   PAUSADO" : ""), 48, 682, GRAY);
  }
}

// ---------- loop ----------
const prevPad = {};
function pollPad(d) {
  const g = (navigator.getGamepads ? navigator.getGamepads() : []).find(p => p);
  if (!g) return;
  const map = { a: 1, b: 0, l: 4, r: 5, zl: 6, zr: 7, plus: 9, up: 12, down: 13, left: 14, right: 15 };
  for (const k in map) {
    const on = !!(g.buttons[map[k]] && g.buttons[map[k]].pressed);
    if (on && !prevPad[k]) d[k] = true;
    prevPad[k] = on;
  }
}
function frame(now) {
  const d = down; down = {};
  pollPad(d);
  if (mode === "boot") clear(0, 0, 0);
  else if (mode === "exited") { clear(0, 0, 0); txt(0, "App encerrado (+). Aperte A para abrir de novo.", 48, 680, GRAY); if (d.a) load(); }
  else if (mode === "menu") menu(d, now);
  else if (mode === "detail") detail(d);
  else if (mode === "play") player(d, now);
  else if (mode === "err") {
    clear(20, 20, 20); txt(1, "Erro ao reproduzir: " + erro, 48, 320);
    if (now > errUntil) mode = "detail";
  }
  requestAnimationFrame(frame);
}

// ---------- entrada ----------
const KEYS = { "[": "l", "]": "r", pageup: "l", pagedown: "r", arrowup: "up", arrowdown: "down", arrowleft: "left", arrowright: "right", enter: "a", z: "a", escape: "b", backspace: "b", x: "b", q: "zl", e: "zr", p: "plus" };
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.repeat) return;
  const k = KEYS[e.key.toLowerCase()];
  if (k) { down[k] = true; e.preventDefault(); }
});
document.querySelectorAll("[data-b]").forEach(b => b.addEventListener("pointerdown", e => { e.preventDefault(); down[b.dataset.b] = true; }));
$("reload").onclick = load;
$("openLocal").onclick = () => $("file").click();
$("file").onchange = async e => { const f = e.target.files[0]; if (f) { localJson = await f.text(); $("url").value = "local"; load(); } e.target.value = ""; };
$("fs").onclick = () => $("stage").requestFullscreen && $("stage").requestFullscreen();

load();
requestAnimationFrame(frame);
</script>
