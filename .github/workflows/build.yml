name: Build NRO

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        shell: bash
        run: |
          command -v curl >/dev/null || (apt-get update && apt-get install -y curl)

          retry() {
            for i in 1 2 3 4 5 6; do
              "$@" && return 0
              echo "Tentativa $i falhou (pkg.devkitpro.org pode estar com 403). Aguardando..."
              sleep $((i * 30))
            done
            return 1
          }

          # sincroniza os bancos (sem -u: nao precisa atualizar o sistema todo)
          retry dkp-pacman -Sy --noconfirm

          retry dkp-pacman -S --noconfirm --needed \
            switch-pkg-config switch-sdl2 switch-sdl2_image switch-sdl2_ttf \
            switch-curl switch-mbedtls switch-ffmpeg switch-libmpv

          curl -L --retry 5 --retry-delay 5 -o source/json.hpp \
            https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp

      - name: Compilar
        run: make -j$(nproc)

      - name: Montar pacote para o SD
        run: |
          mkdir -p out/switch/netflix-player
          cp netflix-player.nro out/switch/netflix-player/
          cp videos.json out/switch/netflix-player/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: netflix-player
          path: out/
