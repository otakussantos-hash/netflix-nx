name: Build NRO

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      # Guarda as bibliotecas depois da 1a build que funcionar:
      # nas proximas, nao depende mais do servidor do devkitPro.
      - name: Cache das bibliotecas do Switch
        id: cache
        uses: actions/cache@v4
        with:
          path: /opt/devkitpro/portlibs
          key: portlibs-switch-v1

      - name: Diagnostico do servidor devkitPro
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: curl -sI --max-time 20 https://pkg.devkitpro.org/packages/dkp-libs.db | head -15

      - name: Instalar dependencias
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          command -v curl >/dev/null || (apt-get update && apt-get install -y curl)

          retry() {
            for i in 1 2 3 4; do
              "$@" && return 0
              echo "Tentativa $i falhou (pkg.devkitpro.org pode estar com 403). Aguardando..."
              sleep $((i * 30))
            done
            return 1
          }

          PKGS="switch-pkg-config switch-sdl2 switch-sdl2_image switch-sdl2_ttf switch-curl switch-mbedtls switch-ffmpeg switch-libmpv"

          if retry dkp-pacman -Sy --noconfirm; then
            retry dkp-pacman -S --noconfirm --needed $PKGS
          else
            echo "Sem sincronizar: tentando com a lista de pacotes que ja vem na imagem..."
            retry dkp-pacman -S --noconfirm --needed $PKGS
          fi

      - name: Baixar json.hpp
        run: |
          curl -L --retry 5 --retry-delay 5 -o source/json.hpp \
            https://github.com/nlohmann/json/releases/download/v3.11.3/json.hpp

      - name: Compilar
        run: make -j$(nproc)

      - name: Montar pacote para o SD
        run: |
          mkdir -p out/switch/netflix-player
          cp netflix-player.nro out/switch/netflix-player/
          cp videos.json out/switch/netflix-player/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: netflix-player
          path: out/
